# ~/.ssh/config snippet for the mu stack. Include it from ~/.ssh/config:
#
#   Include ~/path/to/mu-crew-dotfiles/ssh/mu-crew.conf
#
# Then replace `dev` below with your own hosts. Keep this Include near the top:
# ssh uses the first value it finds for each option.

# murmur collects peers with BatchMode=yes and rides any master on the
# ControlPath below. `ControlMaster auto` makes a plain `ssh dev` open one, so
# a host that needs a second factor is collectable after you log in once.
# Create the directory first: mkdir -p ~/.ssh/control
Host dev
    ControlMaster auto
    ControlPath ~/.ssh/control/%r@%h:%p
    ControlPersist 8h

# A host with `MaxSessions 1` (one session channel per connection): do NOT
# share one master between you, murmur and mule, because each would take the
# other's only slot. Open murmur's master explicitly and leave it running:
#
#   ssh -MNf -S '~/.ssh/control/%r@%h:%p' dev
#
# Do your own interactive work over Eternal Terminal, which holds no ssh
# session once connected. See murmur's SSH.md.

# mule uses its own master on its own socket, never this one, so long jobs do
# not take murmur's slot. Open it once per ControlPersist window:
#
#   mkdir -p ~/.ssh/mule
#   ssh -MNf -S ~/.ssh/mule/dev.sock -o ControlPersist=8h dev
#
# and point mule at it in ~/.config/mule/config.toml:
#
#   [hosts.dev]
#   target = "dev"
