# mu-crew.conf -- tmux wiring for mu, murmur and mule.
#
#   source-file ~/path/to/mu-crew-dotfiles/tmux/mu-crew.conf
#
# Stack wiring only: binds, hooks, and formats you place yourself. No theme,
# and status-right is yours. Add the pill with #{E:@mu_crew_pill}.
#
# Keys (under the prefix). Set before sourcing to move one, or to "none" to
# leave it unbound:
#   @mu_crew_key_pick       a    murmur picker popup
#   @mu_crew_key_sidepanel  C-m  murmur side panel toggle
#   @mu_crew_key_dash       G    back to the murmur dash
#   @mu_crew_key_workstream u    mu workstream <-> workspace picker

set -gF @mu_crew_dir "#{d:current_file}"

# ---------------------------------------------------------------------------
# Focus hooks: looking at an agent acknowledges its done/blocked state.
# ---------------------------------------------------------------------------
# Without these a badge never clears. Indexed so they add to your own hooks
# instead of replacing them. after-select-pane, not pane-focus-in: tmux has no
# pane-focus-in hook, and set-hook accepts an unknown name silently.
%hidden MU_CREW_CLEAR="run-shell -b 'command -v murmur >/dev/null 2>&1 && murmur clear --pane #{pane_id}'"
set-hook -g after-select-pane[42]      "$MU_CREW_CLEAR"
set-hook -g after-select-window[42]    "$MU_CREW_CLEAR"
set-hook -g client-session-changed[42] "$MU_CREW_CLEAR"

# ---------------------------------------------------------------------------
# Keys
# ---------------------------------------------------------------------------
if -F "#{==:#{@mu_crew_key_pick},}" "set -g @mu_crew_key_pick a"
if -F "#{==:#{@mu_crew_key_sidepanel},}" "set -g @mu_crew_key_sidepanel C-m"
if -F "#{==:#{@mu_crew_key_dash},}" "set -g @mu_crew_key_dash G"
if -F "#{==:#{@mu_crew_key_workstream},}" "set -g @mu_crew_key_workstream u"
run-shell "#{@mu_crew_dir}/scripts/mu-crew-bind"

# ---------------------------------------------------------------------------
# State glyphs
# ---------------------------------------------------------------------------
# murmur publishes these options (see murmur ARCHITECTURE.md):
#   @murmur_session_state  session   strongest state across its panes
#   @murmur_window_state   window    strongest state across its panes
#   @murmur_pane_state     pane      that pane's own state, idle included
#   @murmur_count_<state>  global    this host's counts, unset at zero
# States are crashed, blocked, done, working, idle.
#
# The chains set no background: tmux carries the caller's #[bg=...] into an
# #{E:...} re-expansion, so each format supplies its own.
#
# THEME BEGIN: mu-crew-glyphs
# Defaults need a Nerd Font (https://www.nerdfonts.com); they are the glyphs
# murmur's own dash uses, so an agent looks the same everywhere. No Nerd Font?
# `set -g @mu_crew_ascii 1` before sourcing picks plain ASCII instead. To
# change one glyph or colour, set its option after sourcing.
set -g @mu_crew_c_crashed "#f38ba8"
set -g @mu_crew_c_blocked "#fab387"
set -g @mu_crew_c_done "#94e2d5"
set -g @mu_crew_c_working "#a6adc8"
set -g @mu_crew_c_idle "#6c7086"
set -g @mu_crew_g_crashed ""
set -g @mu_crew_g_blocked ""
set -g @mu_crew_g_done ""
set -g @mu_crew_g_working ""
set -g @mu_crew_g_idle ""
set -g @mu_crew_g_crew ""
set -g @mu_crew_g_agent "󰚩"
if -F "#{==:#{@mu_crew_ascii},1}" {
  set -g @mu_crew_g_crashed "x"
  set -g @mu_crew_g_blocked "!"
  set -g @mu_crew_g_done "+"
  set -g @mu_crew_g_working ">"
  set -g @mu_crew_g_idle "-"
  set -g @mu_crew_g_crew "c"
  set -g @mu_crew_g_agent "ai"
}
# THEME END: mu-crew-glyphs

# One glyph for a window: " <glyph>", or nothing. An agent window with no
# news shows the idle glyph (@murmur_window_has_agent).
set -g @mu_crew_window_glyph "#{?#{==:#{@murmur_window_state},crashed}, #[fg=#{@mu_crew_c_crashed}]#[bold]#{@mu_crew_g_crashed}#[nobold],#{?#{==:#{@murmur_window_state},blocked}, #[fg=#{@mu_crew_c_blocked}]#{@mu_crew_g_blocked},#{?#{==:#{@murmur_window_state},done}, #[fg=#{@mu_crew_c_done}]#{@mu_crew_g_done},#{?#{==:#{@murmur_window_state},working}, #{@mu_crew_g_working},#{?#{@murmur_window_has_agent}, #[fg=#{@mu_crew_c_idle}]#{@mu_crew_g_idle},}}}}}"

# One glyph for a pane border: " · <glyph>", or nothing.
set -g @mu_crew_pane_glyph "#{?#{==:#{@murmur_pane_state},crashed}, · #[fg=#{@mu_crew_c_crashed}]#[bold]#{@mu_crew_g_crashed}#[nobold],#{?#{==:#{@murmur_pane_state},blocked}, · #[fg=#{@mu_crew_c_blocked}]#{@mu_crew_g_blocked},#{?#{==:#{@murmur_pane_state},done}, · #[fg=#{@mu_crew_c_done}]#{@mu_crew_g_done},#{?#{==:#{@murmur_pane_state},working}, · #{@mu_crew_g_working},#{?#{==:#{@murmur_pane_state},idle}, · #{@mu_crew_g_idle},}}}}}"

# ---------------------------------------------------------------------------
# Pane titles
# ---------------------------------------------------------------------------
# mu sets each agent pane's title to the agent name plus its tasks, and turns
# the top border on; murmur owns the live state. To keep your own
# pane-border-format, set @mu_crew_keep_pane_border 1 before sourcing and add
# #{E:@mu_crew_pane_glyph} to it yourself.
if -F "#{!=:#{@mu_crew_keep_pane_border},1}" \
  "set -g pane-border-format ' #{pane_title}#{E:@mu_crew_pane_glyph} '"

# ---------------------------------------------------------------------------
# Agent pill
# ---------------------------------------------------------------------------
# Counts per state: this host's from murmur (@murmur_count_*), plus remote
# peers' from the poller (@mu_crew_remote_*). Pure format: no process runs on
# a status redraw. Use it in your own status line:
#   set -ag status-right '#{E:@mu_crew_pill}'
set -g @mu_crew_n_crashed "#{e|+:#{@murmur_count_crashed},#{@mu_crew_remote_crashed}}"
set -g @mu_crew_n_blocked "#{e|+:#{@murmur_count_blocked},#{@mu_crew_remote_blocked}}"
set -g @mu_crew_n_done "#{e|+:#{@murmur_count_done},#{@mu_crew_remote_done}}"
set -g @mu_crew_n_working "#{e|+:#{@murmur_count_working},#{@mu_crew_remote_working}}"
set -g @mu_crew_n_idle "#{e|+:#{@murmur_count_idle},#{@mu_crew_remote_idle}}"
set -g @mu_crew_n_crew "#{e|+:#{@murmur_count_crew},#{@mu_crew_remote_crew}}"
set -g @mu_crew_n_any "#{e|+:#{e|+:#{e|+:#{E:@mu_crew_n_crashed},#{E:@mu_crew_n_blocked}},#{e|+:#{E:@mu_crew_n_done},#{E:@mu_crew_n_working}}},#{e|+:#{E:@mu_crew_n_idle},#{E:@mu_crew_n_crew}}}"

# One run per state: "<count><glyph>" in the state's colour, most urgent first.
set -g @mu_crew_pill "#{?#{e|>:#{E:@mu_crew_n_any},0}, #[fg=#{@mu_crew_c_working}]#{@mu_crew_g_agent}\
#{?#{e|>:#{E:@mu_crew_n_crashed},0}, #[fg=#{@mu_crew_c_crashed}]#[bold]#{E:@mu_crew_n_crashed}#{@mu_crew_g_crashed}#[nobold],}\
#{?#{e|>:#{E:@mu_crew_n_blocked},0}, #[fg=#{@mu_crew_c_blocked}]#{E:@mu_crew_n_blocked}#{@mu_crew_g_blocked},}\
#{?#{e|>:#{E:@mu_crew_n_done},0}, #[fg=#{@mu_crew_c_done}]#{E:@mu_crew_n_done}#{@mu_crew_g_done},}\
#{?#{e|>:#{E:@mu_crew_n_working},0}, #[fg=#{@mu_crew_c_working}]#{E:@mu_crew_n_working}#{@mu_crew_g_working},}\
#{?#{e|>:#{E:@mu_crew_n_idle},0}, #[fg=#{@mu_crew_c_idle}]#{E:@mu_crew_n_idle}#{@mu_crew_g_idle},}\
#{?#{e|>:#{E:@mu_crew_n_crew},0}, #[fg=#{@mu_crew_c_idle}]#{E:@mu_crew_n_crew}#{@mu_crew_g_crew},} #[default],}"

# Remote peers: one background loop, started here, writing @mu_crew_remote_*.
# It exits on its own when there are no peers or no murmur.
run-shell -b "#{@mu_crew_dir}/scripts/murmur-remote-poller --ensure"
