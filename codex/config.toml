# ~/.codex/config.toml needs nothing from mu-crew. Codex's hooks live in
# ~/.codex/hooks.json, which `murmur init`, `mu init` and `muzzle init` write:
# see hooks.json next to this file. Hooks are on by default
# (`[features] hooks = true`). Codex asks you to trust a new or changed hook
# once: run /hooks.
#
# Remove the older attention-only line if you still have it:
#
#   notify = ["murmur", "notify", "--source", "codex"]
#
# With murmur's hooks in hooks.json it reports every finished turn twice, and
# `murmur init` and `murmur doctor` say so. Keep muzzle's hook in hooks.json
# only, not also as an inline [[hooks.PreToolUse]] here, or every shell call
# is matched twice (`muzzle doctor` warns).
